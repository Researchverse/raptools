name: CRAN Status Check

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  cran-status:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install dependencies
        run: |
          install.packages(c("cchecks", "dplyr", "tibble"))
          cat("Installed packages:\n")
          print(installed.packages()[,c("Package", "Version")])
        shell: Rscript {0}
        
      - name: Check CRAN Status
        run: |
          if (!require("cchecks", quietly = TRUE)) {
            stop("cchecks package not installed")
          }
          if (!require("dplyr", quietly = TRUE)) {
            stop("dplyr package not installed")
          }
          
          library(cchecks)
          library(dplyr)
          
          # Get CRAN check results
          results <- cch_pkgs("raptools")
          
          if (is.null(results) || length(results$data) == 0) {
            message("Package not found on CRAN or no check results available")
            quit(status = 0)
          }
          
          checks <- results$data$checks[[1]]
          
          # Count statuses
          status_summary <- checks %>%
            count(status) %>%
            arrange(desc(n))
          
          cat("\n=== CRAN Check Summary ===", "\n")
          print(status_summary)
          
          # Check for ERRORs
          if (any(checks$status == "ERROR")) {
            error_checks <- checks %>% filter(status == "ERROR")
            cat("\n::error::CRAN checks show ERRORs on:", paste(error_checks$flavor, collapse=", "), "\n")
            quit(status = 1)
          }
          
          # Check for WARNINGs
          if (any(checks$status == "WARN")) {
            warn_checks <- checks %>% filter(status == "WARN")
            cat("\n::warning::CRAN checks show WARNINGs on:", paste(warn_checks$flavor, collapse=", "), "\n")
          }
          
          # Check for NOTEs
          if (any(checks$status == "NOTE")) {
            note_checks <- checks %>% filter(status == "NOTE")
            cat("\nNOTEs on:", paste(note_checks$flavor, collapse=", "), "\n")
          }
          
          # Success message
          if (all(checks$status == "OK")) {
            cat("\n✅ All CRAN checks passing!\n")
          }
        shell: Rscript {0}
