name: CRAN Status Check

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  cran-status:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check CRAN Status
        run: |
          echo "Checking CRAN status for raptools..."
          
          # Fetch CRAN check results JSON
          curl -s "https://cran-checks-api.r-pkg.org/v1/package/raptools" > cran_status.json
          
          # Check if package exists
          if grep -q '"error"' cran_status.json; then
            echo "❌ Package not found on CRAN or API unavailable"
            cat cran_status.json
            exit 1
          fi
          
          # Parse status
          ERROR_COUNT=$(grep -o '"status":"ERROR"' cran_status.json | wc -l)
          WARN_COUNT=$(grep -o '"status":"WARN"' cran_status.json | wc -l)
          NOTE_COUNT=$(grep -o '"status":"NOTE"' cran_status.json | wc -l)
          OK_COUNT=$(grep -o '"status":"OK"' cran_status.json | wc -l)
          
          echo ""
          echo "=== CRAN Check Summary ==="
          echo "OK:    $OK_COUNT"
          echo "NOTE:  $NOTE_COUNT"
          echo "WARN:  $WARN_COUNT"
          echo "ERROR: $ERROR_COUNT"
          echo ""
          
          # Show details
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::CRAN checks show $ERROR_COUNT ERROR(s)"
            grep -A 5 '"status":"ERROR"' cran_status.json || true
            exit 1
          fi
          
          if [ "$WARN_COUNT" -gt 0 ]; then
            echo "::warning::CRAN checks show $WARN_COUNT WARNING(s)"
            grep -A 5 '"status":"WARN"' cran_status.json || true
          fi
          
          if [ "$NOTE_COUNT" -gt 0 ]; then
            echo "ℹ️ CRAN checks show $NOTE_COUNT NOTE(s)"
          fi
          
          if [ "$ERROR_COUNT" -eq 0 ] && [ "$WARN_COUNT" -eq 0 ]; then
            echo "✅ All CRAN checks passing!"
          fi
