name: pages-build-deployment

on:
  push:
    branches: [ gh-pages ]

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy to GitHub Pages (uses built-in Pages deploy)
      uses: actions/deploy-pages@v1
